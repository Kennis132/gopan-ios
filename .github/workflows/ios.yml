name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # 单元测试
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project gopan.xcodeproj -scheme gopan \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            2>&1 | tee xcodebuild-test.log

      # 失败时把 error 行吐成 annotation，便于匿名读取排查
      - name: Surface errors
        if: failure()
        run: |
          { grep -E "error: " xcodebuild-test.log || true; grep -E "Test Case .* failed" xcodebuild-test.log || true; } | sort -u | head -50 | while IFS= read -r line; do
            echo "::error::${line}"
            echo "${line}" >> "$GITHUB_STEP_SUMMARY"
          done
          tail -40 xcodebuild-test.log > test-tail.log || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat test-tail.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 编译未签名 IPA（供 Sideloadly / 爱思助手用免费 Apple ID 自签后安装）
      - name: Build unsigned IPA
        run: |
          xcodebuild \
            -project gopan.xcodeproj -scheme gopan \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R "build/Build/Products/Release-iphoneos/gopan.app" build/Payload/
          cd build
          zip -qry gopan-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: gopan-unsigned-ipa
          path: build/gopan-unsigned.ipa

      - name: Upload build log artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/Logs/**/*.xcresult
          if-no-files-found: ignore
